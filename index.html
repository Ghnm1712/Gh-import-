<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Import | Sua Loja Multimarcas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Sidebar Carrinho */
        .cart-sidebar {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100vh;
            background: white; z-index: 1001; transition: right 0.4s ease;
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        }
        .cart-sidebar.open { right: 0; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; display: none;
        }
        .overlay.open { display: block; }

        /* --- CARROSSEL DE ANÚNCIOS (BANNER) --- */
        .ml-section { background: #fbbf24; width: 100%; overflow: hidden; }
        .ml-container { position: relative; width: 100%; }
        .ml-track { display: flex; transition: transform 0.6s ease-in-out; }
        .ml-slide { flex: 0 0 100%; padding: 15px 0; }
        .ml-offer-box {
            background: white; margin: 0 auto; max-width: 90%;
            padding: 15px 25px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .ml-offer-text { font-weight: 800; color: #1e1b4b; font-size: 1.1rem; }
        .ml-btn {
            background: #00a650; color: white; padding: 10px 20px;
            border-radius: 8px; font-weight: 900; text-transform: uppercase;
            font-size: 0.8rem; transition: background 0.3s; text-decoration: none;
        }
        .ml-btn:hover { background: #008744; }

        /* --- CARROSSEL DE IMAGENS PRINCIPAL (450px com imagens otimizadas) --- */
        .hero-slider { position: relative; width: 100%; height: 450px; overflow: hidden; background: #000; }
        .hero-track { display: flex; height: 100%; transition: transform 0.8s ease-in-out; }
        .hero-slide { flex: 0 0 100%; height: 100%; }
        .hero-slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            filter: brightness(0.95);
        }

        /* Cards de Produto */
        .product-card { transition: transform 0.3s; border: 1px solid #eee; background: white; border-radius: 1rem; overflow: hidden; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.15); }
        
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; z-index: 999; }
        .whatsapp-float a { 
            display: flex; align-items: center; justify-content: center;
            width: 65px; height: 65px; background: #25D366; border-radius: 50%;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .whatsapp-float a:hover { transform: scale(1.1); }
        
        @media (max-width: 768px) {
            .hero-slider { height: 350px; }
            .ml-offer-box { flex-direction: column; text-align: center; gap: 10px; }
            .ml-offer-text { font-size: 0.9rem; }
            .ml-btn { font-size: 0.7rem; padding: 8px 16px; }
            .cart-sidebar { width: 100%; right: -100%; }
        }
        
        @media (max-width: 640px) {
            .hero-slider { height: 280px; }
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="bg-indigo-700 text-white p-6 flex justify-between items-center">
            <h3 class="text-xl font-bold">CARRINHO</h3>
            <button onclick="toggleCart()" class="text-3xl hover:text-gray-200">&times;</button>
        </div>
        <div id="cartItems" class="p-6 overflow-y-auto" style="height: calc(100vh - 200px);"></div>
        <div class="absolute bottom-0 w-full p-6 bg-white border-t shadow-lg">
            <div class="flex justify-between font-black text-xl mb-4">
                <span>TOTAL:</span> <span id="cartTotal" class="text-indigo-600">R$ 0,00</span>
            </div>
            <button onclick="checkout()" class="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-xl font-black transition">FINALIZAR NO WHATSAPP</button>
        </div>
    </div>

    <!-- Banner de Ofertas Mercado Livre -->
    <div class="ml-section">
        <div class="ml-container">
            <div class="ml-track" id="mlTrack">
                <div class="ml-slide">
                    <div class="ml-offer-box">
                        <span class="ml-offer-text">🔥 CREATINA DARK LAB 1kg | <span class="text-red-500 line-through">R$ 159</span> <span class="text-green-600 font-bold">R$ 69,90</span></span>
                        <a href="https://meli.la/1DwmLWU" target="_blank" class="ml-btn">Comprar no ML</a>
                    </div>
                </div>
                <div class="ml-slide">
                    <div class="ml-offer-box">
                        <span class="ml-offer-text">⚡ OFERTA RELÂMPAGO GM Import | <span class="text-green-600">ATÉ 60% OFF</span></span>
                        <a href="https://meli.la/1wNG1Hd" target="_blank" class="ml-btn">Ver Link</a>
                    </div>
                </div>
                <div class="ml-slide">
                    <div class="ml-offer-box">
                        <span class="ml-offer-text">💎 SELEÇÃO PREMIUM | <span class="text-green-600">FRETE GRÁTIS</span></span>
                        <a href="https://meli.la/2i36if8" target="_blank" class="ml-btn">Acessar</a>
                    </div>
                </div>
                <div class="ml-slide">
                    <div class="ml-offer-box">
                        <span class="ml-offer-text">🚚 ENTREGA FULL para todo Brasil | <span class="text-green-600">+ RÁPIDO</span></span>
                        <a href="https://meli.la/2TTJj3E" target="_blank" class="ml-btn">Aproveitar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-indigo-700 italic">GM IMPORT</h1>
            <div class="hidden md:flex space-x-6 font-bold text-gray-600 text-xs uppercase">
                <a href="#masculino" class="hover:text-indigo-700 transition">Masculino</a>
                <a href="#feminino" class="hover:text-indigo-700 transition">Feminino</a>
                <a href="#perfumes" class="hover:text-indigo-700 transition">Perfumes</a>
            </div>
            <button onclick="toggleCart()" class="relative p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition">
                <i class="fa-solid fa-cart-shopping text-gray-700 text-xl"></i>
                <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </nav>

    <!-- Carrossel Principal com Imagens em Resolução Menor (otimizadas) -->
    <div class="hero-slider">
        <div class="hero-track" id="heroTrack">
            <div class="hero-slide">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800&h=450&fit=crop&q=80" alt="Tênis Esportivos">
            </div>
            <div class="hero-slide">
                <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=800&h=450&fit=crop&q=80" alt="Perfumes Premium">
            </div>
            <div class="hero-slide">
                <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=800&h=450&fit=crop&q=80" alt="Tênis e Acessórios">
            </div>
        </div>
    </div>

    <!-- Produtos -->
    <main class="container mx-auto px-6 py-12">
        <section id="masculino" class="mb-16">
            <h2 class="text-3xl font-black mb-8 border-l-8 border-indigo-600 pl-4 uppercase">Masculino</h2>
            <div id="grid-masculino" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>

        <section id="feminino" class="mb-16">
            <h2 class="text-3xl font-black mb-8 border-l-8 border-pink-500 pl-4 uppercase">Feminino</h2>
            <div id="grid-feminino" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>

        <section id="perfumes" class="mb-16">
            <h2 class="text-3xl font-black mb-8 border-l-8 border-yellow-500 pl-4 uppercase">Perfumes</h2>
            <div id="grid-perfumes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>
    </main>

    <!-- WhatsApp Flutuante -->
    <div class="whatsapp-float">
        <a href="https://wa.me/5561982740074?text=Olá! Gostaria de fazer um pedido na GM Import!" target="_blank" class="hover:scale-110 transition">
            <i class="fa-brands fa-whatsapp text-4xl text-white"></i>
        </a>
    </div>

    <script>
        // Base de produtos
        const produtos = [
            { id: 1, nome: "Tênis Nike Air Max", preco: 459.90, cat: "masculino", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop" },
            { id: 2, nome: "Camisa Polo Slim Fit", preco: 149.90, cat: "masculino", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400&h=400&fit=crop" },
            { id: 3, nome: "Jaqueta Jeans Azul", preco: 289.90, cat: "masculino", img: "https://images.unsplash.com/photo-1576871337622-98d48d1cf531?w=400&h=400&fit=crop" },
            { id: 4, nome: "Tênis Casual", preco: 199.90, cat: "masculino", img: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400&h=400&fit=crop" },
            { id: 5, nome: "Vestido Floral Luxo", preco: 219.90, cat: "feminino", img: "https://images.unsplash.com/photo-1572804013307-5977584105b8?w=400&h=400&fit=crop" },
            { id: 6, nome: "Bolsa Feminina", preco: 179.90, cat: "feminino", img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400&h=400&fit=crop" },
            { id: 7, nome: "Sandália Rasteira", preco: 89.90, cat: "feminino", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=400&h=400&fit=crop" },
            { id: 8, nome: "Blusa de Frio", preco: 159.90, cat: "feminino", img: "https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=400&h=400&fit=crop" },
            { id: 9, nome: "Perfume Importado 100ml", preco: 399.00, cat: "perfumes", img: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=400&h=400&fit=crop" },
            { id: 10, nome: "Kit Perfumes (3 unidades)", preco: 299.00, cat: "perfumes", img: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=400&h=400&fit=crop" },
            { id: 11, nome: "Perfume Francês", preco: 459.00, cat: "perfumes", img: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400&h=400&fit=crop" }
        ];

        let carrinho = JSON.parse(localStorage.getItem('gmCartFinal')) || [];

        function saveCart() {
            localStorage.setItem('gmCartFinal', JSON.stringify(carrinho));
        }

        function renderProdutos() {
            const categorias = ['masculino', 'feminino', 'perfumes'];
            categorias.forEach(cat => {
                const container = document.getElementById(`grid-${cat}`);
                if (!container) return;
                const itens = produtos.filter(p => p.cat === cat);
                container.innerHTML = itens.map(p => `
                    <div class="product-card bg-white rounded-2xl shadow-md overflow-hidden group">
                        <img src="${p.img}" class="w-full h-64 object-cover group-hover:scale-105 transition duration-500" alt="${p.nome}">
                        <div class="p-4">
                            <h3 class="font-bold text-gray-800 text-lg">${p.nome}</h3>
                            <p class="text-indigo-600 font-black text-2xl mt-1">R$ ${p.preco.toFixed(2)}</p>
                            <button onclick="addToCart(${p.id})" class="w-full bg-gray-900 hover:bg-indigo-700 text-white mt-4 py-3 rounded-xl font-bold transition">
                                <i class="fa-solid fa-cart-plus mr-2"></i> ADICIONAR
                            </button>
                        </div>
                    </div>
                `).join('');
            });
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function addToCart(id) {
            const produto = produtos.find(p => p.id === id);
            const existente = carrinho.find(item => item.id === id);
            if (existente) {
                existente.qtd = (existente.qtd || 1) + 1;
            } else {
                carrinho.push({ ...produto, qtd: 1 });
            }
            updateCart();
            saveCart();
            toggleCart();
        }

        function updateCart() {
            const container = document.getElementById('cartItems');
            const totalQtd = carrinho.reduce((acc, item) => acc + (item.qtd || 1), 0);
            document.getElementById('cartCount').innerText = totalQtd;
            
            if (carrinho.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-10"><i class="fa-solid fa-bag-shopping text-5xl mb-3"></i><p>Seu carrinho está vazio</p></div>';
                document.getElementById('cartTotal').innerText = 'R$ 0,00';
                return;
            }
            
            container.innerHTML = carrinho.map((item, idx) => `
                <div class="flex justify-between items-start border-b pb-4 mb-4">
                    <div class="flex-1">
                        <p class="font-bold text-gray-800">${item.nome}</p>
                        <p class="text-indigo-600 font-bold">R$ ${item.preco.toFixed(2)}</p>
                        <div class="flex items-center gap-3 mt-2">
                            <button onclick="alterarQtd(${idx}, -1)" class="bg-gray-200 px-3 py-1 rounded-lg font-bold">-</button>
                            <span class="font-bold">${item.qtd || 1}</span>
                            <button onclick="alterarQtd(${idx}, 1)" class="bg-gray-200 px-3 py-1 rounded-lg font-bold">+</button>
                        </div>
                    </div>
                    <button onclick="removerItem(${idx})" class="text-red-500 hover:text-red-700 font-bold text-sm"><i class="fa-regular fa-trash-can text-lg"></i></button>
                </div>
            `).join('');
            
            const total = carrinho.reduce((acc, item) => acc + (item.preco * (item.qtd || 1)), 0);
            document.getElementById('cartTotal').innerText = `R$ ${total.toFixed(2)}`;
        }

        function alterarQtd(index, delta) {
            if (carrinho[index]) {
                const novaQtd = (carrinho[index].qtd || 1) + delta;
                if (novaQtd <= 0) {
                    carrinho.splice(index, 1);
                } else {
                    carrinho[index].qtd = novaQtd;
                }
                updateCart();
                saveCart();
            }
        }

        function removerItem(index) {
            carrinho.splice(index, 1);
            updateCart();
            saveCart();
        }

        function checkout() {
            if(carrinho.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }
            
            let mensagem = "🛍️ *PEDIDO GM IMPORT* 🛍️\n\n";
            let total = 0;
            
            carrinho.forEach(item => {
                const qtd = item.qtd || 1;
                mensagem += `• ${item.nome}\n  Quantidade: ${qtd}\n  Valor: R$ ${(item.preco * qtd).toFixed(2)}\n\n`;
                total += item.preco * qtd;
            });
            
            mensagem += `────────────────────\n📦 *TOTAL: R$ ${total.toFixed(2)}*\n\n`;
            mensagem += "👤 *Dados do Cliente:*\n";
            mensagem += "Nome: \n";
            mensagem += "Endereço: \n";
            mensagem += "Complemento/Referência: \n\n";
            mensagem += "🔗 *GM Import -  Agradecemos a preferência!*";
            
            window.open(`https://wa.me/5561982740074?text=${encodeURIComponent(mensagem)}`, '_blank');
        }

        // Carrosséis Automáticos
        let mlIdx = 0;
        let heroIdx = 0;
        const mlTotal = 4;
        const heroTotal = 3;
        
        setInterval(() => {
            mlIdx = (mlIdx + 1) % mlTotal;
            document.getElementById('mlTrack').style.transform = `translateX(-${mlIdx * 100}%)`;
        }, 5000);

        setInterval(() => {
            heroIdx = (heroIdx + 1) % heroTotal;
            document.getElementById('heroTrack').style.transform = `translateX(-${heroIdx * 100}%)`;
        }, 6000);

        // Inicialização
        renderProdutos();
        updateCart();
    </script>
</body>
</html>
